<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transform</title>
    <link rel="stylesheet" href="./perspective.css" />
  </head>
  <body>
    <div class="scenes">
      <div class="card">
        <div class="card-face">
          <span class="card-value">A</span> <span class="card-suit">♠</span>
        </div>
        <div class="card-back">
          <img src="./images/card-back.jpg" width="200" height="300" />
        </div>
      </div>
    </div>
    <div class="characters">
      <article class="character">
        <div class="avatar">⚔️</div>
        <h2>Warrior</h2>
        <p>Strength</p>
      </article>

      <article class="character">
        <div class="avatar">🧙</div>
        <h2>Mage</h2>
        <p>Magic</p>
      </article>

      <article class="character">
        <div class="avatar">🏹</div>
        <h2>Archer</h2>
        <p>Agility</p>
      </article>
    </div>
    <div class="space">
      <div class="planet">🌍</div>
    </div>
    <div class="scene">
      <div class="tunnel">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="ring ring-4"></div>
        <div class="ring ring-5"></div>
      </div>
    </div>
    <section>
      <div class="box">BOX</div>
    </section>
    <section>
      <div class="container">
        <div class="box rotate-x">rotateX</div>
        <div class="box rotate-y">rotateY</div>
        <div class="box rotate-z">rotateZ</div>
        <div class="box translateZ">translateZ</div>
      </div>
    </section>
  </body>
</html>
